services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kr
      POSTGRES_PASSWORD: kr-labs-pw
      POSTGRES_DB: semiconductor_trade
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-semiconductor:/var/lib/postgresql/data

  fuseki:
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?Set FUSEKI_ADMIN_PASSWORD in the project .env file}
      FUSEKI_DATASET_1: semiconductor
      TDB: "2"
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - fuseki-semiconductor:/fuseki

volumes:
  postgres-semiconductor:
  fuseki-semiconductor: